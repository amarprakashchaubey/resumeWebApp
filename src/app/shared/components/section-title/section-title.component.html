<div class="section-title">
  @switch (headingLevel) {
    @case ('h1') {
      <h1 class="section-title__heading" [id]="titleId">{{ title }}</h1>
    }
    @case ('h2') {
      <h2 class="section-title__heading" [id]="titleId">{{ title }}</h2>
    }
    @case ('h3') {
      <h3 class="section-title__heading" [id]="titleId">{{ title }}</h3>
    }
  }
  @if (subtitle) {
    <p class="section-title__subtitle">{{ subtitle }}</p>
  }
</div>
