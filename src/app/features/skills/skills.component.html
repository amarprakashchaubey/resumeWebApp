<div class="page-skills" appFadeIn>
  <app-section-title
    title="Skills"
    subtitle="&ldquo;Tools change every season; clarity and consistency are what scale&rdquo; &mdash; the languages, frameworks, and delivery habits I rely on from UI through API to cloud and CI."
  />

  <div class="skills-glass-grid" role="list">
    @for (cat of categories; track cat.id) {
      <article class="skills-glass-card" role="listitem">
        <div class="skills-glass-card__surface">
          <div class="skills-glass-card__preview">
            <mat-icon class="skills-glass-card__icon" aria-hidden="true">{{ cat.icon }}</mat-icon>
            <h3 class="skills-glass-card__title">{{ cat.title }}</h3>
          </div>

          <div class="skills-glass-card__expand">
            <div class="skills-glass-card__expand-inner">
              <ul class="skills-glass-card__skills">
                @for (skill of cat.skills; track skill) {
                  <li>
                    <span class="skills-tag">
                      @if (iconSrc(skill); as src) {
                        <img
                          class="skills-tag__icon"
                          [src]="src"
                          alt=""
                          width="18"
                          height="18"
                          loading="lazy"
                          decoding="async"
                        />
                      }
                      {{ skill }}
                    </span>
                  </li>
                }
              </ul>
            </div>
          </div>
        </div>
      </article>
    }
  </div>
</div>
